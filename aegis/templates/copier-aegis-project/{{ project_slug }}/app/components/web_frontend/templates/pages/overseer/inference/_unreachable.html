{# Where the page looked for the engine when nothing answered there. #}
{% if unreachable %}
<p role="alert" class="text-xs text-error bg-aegis-error/5 border border-aegis-error/40 rounded px-3 py-2">No {{ engine.LABEL }} answered at {{ unreachable }}. Start it with <code>{{ engine.START }}</code>, or check <code>{{ engine.NAME | upper }}_BASE_URL</code>.</p>
{% endif %}
