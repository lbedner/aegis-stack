name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_PYTHON: "3.11"  # Pin every uv command to 3.11 (matches release.yml)
  # Copy packages into the venv instead of hardlinking from uv's cache.
  # setup-uv's cache restore can leave broken hardlinks, so a package
  # imports at top level but is missing submodules/entry points (e.g.
  # "Can't load plugin: sqlalchemy.dialects:sqlite"). Copy mode avoids it.
  UV_LINK_MODE: "copy"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run linting
      run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run type checking
      run: uv run ty check

  # The fast lane in two parallel shards (``--shard``, tests/conftest.py):
  # one 4-worker job ran ~11 minutes; each shard is about half of it.
  test-shard:
    name: test ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run tests
      run: uv run pytest -n auto --dist=loadgroup -v -m "not slow" --shard ${{ matrix.shard }}/2

  # The required check is named ``test``: it passes only when every shard did,
  # so sharding never changes what branch protection waits for.
  test:
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
    - name: Every shard passed
      run: test "${{ needs.test-shard.result }}" = success

  # Every stack combination generates (tests/cli/test_stack_generation.py,
  # marked slow so the fast lane above skips it), in four shards. Here rather
  # than in the path-filtered stack matrix, so every PR generates and the
  # ``generation`` check always reports. A stack's tests share a shard, so
  # each stack is generated once. These tests ran inside ``test`` until
  # they were split out, under this same environment.
  generation-shard:
    name: generation ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Test all stack combinations generate
      run: uv run pytest tests/cli/test_stack_generation.py -v --tb=short --shard ${{ matrix.shard }}/4

  # One check named ``generation`` that passes only when every shard did.
  generation:
    if: always()
    needs: generation-shard
    runs-on: ubuntu-latest
    steps:
    - name: Every shard passed
      run: test "${{ needs.generation-shard.result }}" = success

  test-uvx:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Test uvx aegis help
      run: uvx --from . aegis --help
    
    - name: Test uvx aegis-stack help
      run: uvx --from . aegis-stack --help
    
    - name: Test project creation with uvx aegis
      run: |
        uvx --from . aegis init test-uvx-aegis --to-version HEAD --no-interactive --yes --force
        test -d test-uvx-aegis
        test -f test-uvx-aegis/pyproject.toml

    - name: Test project creation with uvx aegis-stack
      run: |
        uvx --from . aegis-stack init test-uvx-aegis-stack --to-version HEAD --no-interactive --yes --force
        test -d test-uvx-aegis-stack
        test -f test-uvx-aegis-stack/pyproject.toml
    
    - name: Verify generated project structure
      run: |
        cd test-uvx-aegis
        test -d app/components/backend
        test -d app/components/frontend
        test -f app/entrypoints/webserver.py
