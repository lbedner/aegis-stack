name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # For the security jobs at the bottom: a week with no merge is still
  # scanned and audited against that week's advisories.
  schedule:
    - cron: '0 6 * * 1'

env:
  UV_PYTHON: "3.11"  # Pin every uv command to 3.11 (matches release.yml)
  # Copy packages into the venv instead of hardlinking from uv's cache.
  # setup-uv's cache restore can leave broken hardlinks, so a package
  # imports at top level but is missing submodules/entry points (e.g.
  # "Can't load plugin: sqlalchemy.dialects:sqlite"). Copy mode avoids it.
  UV_LINK_MODE: "copy"

# A new push to a PR (a rebase, mostly) stops the run it replaces. Main's runs
# never cancel, so every merge is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub counts every checkout as a clone, and nine jobs a push buried the
  # real clones under CI's: this is the run's one fetch, and the jobs below
  # start from a copy of it. No credentials are kept, so none ride along in
  # the copy. Uncompressed: the tree is mostly compressed media.
  repo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Copy the commit for the other jobs
      run: tar -cf "$RUNNER_TEMP/repo.tar" .

    - name: Hand it over
      uses: actions/upload-artifact@v7
      with:
        name: repo
        path: ${{ runner.temp }}/repo.tar
        compression-level: 0
        retention-days: 1

  lint:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - &get-repo
      name: Get the commit
      uses: actions/download-artifact@v8
      with:
        name: repo
    - &unpack-repo
      name: Unpack it
      run: tar -xf repo.tar && rm repo.tar

    - &install-uv
      name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - &set-up-python
      name: Set up Python
      run: uv python install 3.11
    - &install-dependencies
      name: Install dependencies
      run: uv sync --all-extras
    
    - name: Run linting
      run: uv run ruff check .

  typecheck:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - *get-repo
    - *unpack-repo
    
    - *install-uv
    - *set-up-python
    - *install-dependencies
    
    - name: Run type checking
      run: uv run ty check

  # The fast lane in two parallel shards (``--shard``, tests/conftest.py):
  # one 4-worker job ran ~11 minutes; each shard is about half of it.
  test-shard:
    name: test ${{ matrix.shard }}/2
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - *get-repo
    - *unpack-repo
    
    - *install-uv
    - *set-up-python
    - *install-dependencies
    
    - name: Run tests
      run: uv run pytest -n auto --dist=loadgroup -v -m "not slow" --shard ${{ matrix.shard }}/2

  # The required check is named ``test``: it passes only when every fast-lane
  # shard AND every stack-generation shard did, so splitting the suite never
  # changes what branch protection blocks on.
  test:
    if: always()
    needs: [test-shard, generation-shard]
    runs-on: ubuntu-latest
    steps:
    - name: Every shard passed
      run: |
        test "${{ needs.test-shard.result }}" = success
        test "${{ needs.generation-shard.result }}" = success

  # Every stack combination generates (tests/cli/test_stack_generation.py,
  # marked slow so the fast lane above skips it), in four shards. Here rather
  # than in the path-filtered stack matrix, so every PR generates and the
  # ``generation`` check always reports. A stack's tests share a shard, so
  # each stack is generated once. These tests ran inside ``test`` until
  # they were split out, under this same environment.
  generation-shard:
    name: generation ${{ matrix.shard }}/4
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - *get-repo
    - *unpack-repo
    
    - *install-uv
    - *set-up-python
    - *install-dependencies
    
    - name: Test all stack combinations generate
      run: uv run pytest tests/cli/test_stack_generation.py -v --tb=short --shard ${{ matrix.shard }}/4

  test-uvx:
    needs: repo
    runs-on: ubuntu-latest
    env:
      # The installed CLI has no checkout of its own, and would clone the
      # template from GitHub: main's, not this commit's, and a clone each.
      AEGIS_TEMPLATE_PATH: ${{ github.workspace }}
    steps:
    - *get-repo
    - *unpack-repo
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Test uvx aegis help
      run: uvx --from . aegis --help
    
    - name: Test uvx aegis-stack help
      run: uvx --from . aegis-stack --help
    
    - name: Test project creation with uvx aegis
      run: |
        uvx --from . aegis init test-uvx-aegis --to-version HEAD --no-interactive --yes --force
        test -d test-uvx-aegis
        test -f test-uvx-aegis/pyproject.toml

    - name: Test project creation with uvx aegis-stack
      run: |
        uvx --from . aegis-stack init test-uvx-aegis-stack --to-version HEAD --no-interactive --yes --force
        test -d test-uvx-aegis-stack
        test -f test-uvx-aegis-stack/pyproject.toml
    
    - name: Verify generated project structure
      run: |
        cd test-uvx-aegis
        test -d app/components/backend
        test -d app/components/frontend
        test -f app/entrypoints/webserver.py

  # The two security jobs were a workflow of their own, and two more clones
  # on every push. Their names are required checks: keep them.
  codeql:
    name: CodeQL Analysis
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - *get-repo
    - *unpack-repo

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  audit:
    name: Security Audit
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - *get-repo
    - *unpack-repo

    - *install-uv
    - *set-up-python
    - *install-dependencies

    - name: Run security audit
      run: |
        # Ignoring pip vulnerabilities (uv manages pip, not user-facing)
        # Risk: Low - only affects installation of malicious packages from untrusted sources
        # Mitigation: All packages installed from trusted PyPI with uv.lock verification
        #
        # Ignoring markdown PYSEC-2026-89: no fix version published upstream
        # (markdown 3.8.2 is the latest release). Used only by the docs
        # toolchain (mkdocs), not shipped runtime code. Revisit once a
        # patched release is available.
        uv run pip-audit \
          --ignore-vuln GHSA-4xh5-x5gv-qwph \
          --ignore-vuln GHSA-6vgw-5pg2-w6jp \
          --ignore-vuln GHSA-58qw-9mgm-455v \
          --ignore-vuln ECHO-ffe1-1d3c-d9bc \
          --ignore-vuln ECHO-7db2-03aa-5591 \
          --ignore-vuln PYSEC-2026-89 \
          --ignore-vuln PYSEC-2026-3721
